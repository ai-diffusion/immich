<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Recall</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Complete Recall</h1>
  </header>

  <div id="loading">Reading conversation...</div>

  <div id="status" style="display:none"></div>

  <div id="preview" style="display:none"></div>

  <div class="format-section">
    <label for="format">Export Format:</label>
    <select id="format">
      <option value="markdown">Markdown (.md)</option>
      <option value="text">Plain Text (.txt)</option>
      <option value="json">JSON (.json)</option>
      <option value="html">HTML (.html)</option>
    </select>
  </div>

  <label class="checkbox-label">
    <input type="checkbox" id="include-assets" checked>
    Include images &amp; files
  </label>

  <div class="button-group">
    <button id="download" style="display:none">Download</button>
    <button id="copy" style="display:none">Copy to Clipboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
